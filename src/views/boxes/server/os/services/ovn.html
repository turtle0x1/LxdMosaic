<div class="systemServiceBox row" id="systemServiceOvn">
    <div class="col-md-6">
        <div class="card bg-dark text-white">
            <div class="card-header">
                <h5>State</h5>
            </div>
            <div class="card-body">
                <table class="table table-dark" id="systemServiceOvnState">
                    <tbody>

                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card bg-dark text-white">
            <div class="card-header">
                <h5>Config</h5>
            </div>
            <div class="card-body">
                <table class="table table-dark" id="systemServiceOvnConfig">
                    <tbody>

                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script>
    function renderOvn(data) {
        $("#systemServiceOvn").show()
        $("#systemServiceOvnState > tbody").empty().append(`
            <tr>
                <td><i class="fas fa-info-circle text-info me-2"></i>No State Data</td>
            </tr>
        `)
        $("#systemServiceOvnConfig > tbody").empty().append(`
            <tr>
                <th>Enabled</th>
                <td><i class="fas fa-${data.config.enabled ? "check" : "times"}"></i></td>
            </tr>
            <tr>
                <th>Database</th>
                <td>${data.config.database === "" ? "Not Set" : data.config.database}</td>
            </tr>
            <tr>
                <th>Tunnel Address</th>
                <td>${data.config.tunnel_address === "" ? "Not Set" : data.config.tunnel_address}</td>
            </tr>
            <tr>
                <th>Tunnel Protocol</th>
                <td>${data.config.tunnel_protocol === "" ? "Not Set" : data.config.tunnel_protocol}</td>
            </tr>
        `)
    }
</script>
