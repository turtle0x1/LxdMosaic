<div class="systemServiceBox row" id="systemServiceNvme">
    <div class="col-md-6">
        <div class="card bg-dark text-white">
            <div class="card-header">
                <h5>State</h5>
            </div>
            <div class="card-body">
                <table class="table table-dark" id="systemServiceNvmeState">
                    <tbody>

                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card bg-dark text-white">
            <div class="card-header">
                <h5>Config</h5>
            </div>
            <div class="card-body">
                <table class="table table-dark" id="systemServiceNvmeConfig">
                    <tbody>

                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script>
    function renderNvme(data) {
        $("#systemServiceNvme").show()
        $("#systemServiceNvmeState > tbody").empty().append(`
            <tr>
                <th>Host ID</th>
                <td>${data.state.host_id === "" ? "Not Set" : data.state.host_id }</td>
            </tr>
            <tr>
                <th>Host NQN</th>
                <td>${data.state.host_nqn === "" ? "Not Set" : data.state.host_nqn}</td>
            </tr>
        `)
        $("#systemServiceNvmeConfig > tbody").empty().append(`
            <tr>
                <th>Enabled</th>
                <td><i class="fas fa-${data.config.enabled ? "check" : "times"}"></i></td>
            </tr>
            <tr>
                <th>Targets</th>
                <td>${data.config.targets.length == 0 ? "Not Set" : data.config.targets.join("<br/>")}</td>
            </tr>
        `)
    }
</script>
