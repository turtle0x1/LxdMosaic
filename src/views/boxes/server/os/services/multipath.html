<div class="systemServiceBox row" id="systemServicesMultipath">
    <div class="col-md-6">
        <div class="card bg-dark text-white">
            <div class="card-header">
                <h5>State</h5>
            </div>
            <div class="card-body">
                <table class="table table-dark" id="systemServicesMultipathState">
                    <tbody>

                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card bg-dark text-white">
            <div class="card-header">
                <h5>Config</h5>
            </div>
            <div class="card-body">
                <table class="table table-dark" id="systemServicesMultipathConfig">
                    <tbody>

                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script>
    function renderMultipath(data) {
        $("#systemServicesMultipath").show()
        $("#systemServicesMultipathState > tbody").empty().append(`
            <tr>
                <td><i class="fas fa-info-circle text-info me-2"></i>No State Data</td>
            </tr>
        `)
        $("#systemServicesMultipathConfig > tbody").empty().append(`
            <tr>
                <th>Enabled</th>
                <td><i class="fas fa-${data.config.enabled ? "check" : "times"}"></i></td>
            </tr>
            <tr>
                <th>WWNS</th>
                <td>${data.config.wwns.length == 0 ? "Not Set" : data.config.wwns.join("<br/>")}</td>
            </tr>
        `)
    }
</script>
