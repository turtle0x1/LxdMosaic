<div class="systemServiceBox row" id="systemServiceIscsi">
    <div class="col-md-6">
        <div class="card bg-dark text-white">
            <div class="card-header">
                <h5>State</h5>
            </div>
            <div class="card-body">
                <table class="table table-dark" id="systemServiceIscsiState">
                    <tbody>

                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card bg-dark text-white">
            <div class="card-header">
                <h5>Config</h5>
            </div>
            <div class="card-body">
                <table class="table table-dark" id="systemServiceIscsiConfig">
                    <tbody>

                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script>
    function renderIscsi(data) {
        // $(".systemEndpointBox").hide()
        $("#systemServiceIscsi").show()
        $("#systemServiceIscsiState > tbody").empty().append(`
            <tr>
                <th>Initiator Name</th>
                <td>${data.state.initiator_name !== "" ? data.state.initiator_name : "Not Set"}</td>
            </tr>
        `)
        $("#systemServiceIscsiConfig > tbody").empty().append(`
            <tr>
                <th>Enabled</th>
                <td><i class="fas fa-${data.config.enabled ? "check" : "times"}"></i></td>
            </tr>
            <tr>
                <th>Targets</th>
                <td>${data.config.targets.length == 0 ? "No Targets" : data.config.targets.join("<br/>")}</td>
            </tr>
        `)
    }
</script>
