<div class="systemEndpointBox" id="systemEndpointProvider">
    <div class="row">
        <div class="col-md-6">
            <div class="card bg-dark text-white">
                <div class="card-header">
                    <h5>Config</h5>
                </div>
                <div class="card-body">
                    <table class="table table-dark" id="systemProviderConfigTbl">
                        <tbody>

                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card bg-dark text-white">
                <div class="card-header">
                    <h5>State</h5>
                </div>
                <div class="card-body">
                    <table class="table table-dark" id="systemProviderStateTbl">
                        <tbody>

                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    function renderProvider(data) {
        $("#systemEndpointProvider").show()
        $("#systemProviderConfigTbl > tbody").empty().append(`
            <tr>
                <th>Name</th>
                <td>${data.config.name}</td>
            </tr>
            <tr>
                <th>Config</th>
                <td>${data.config.config == null ? "Not Set" : "Config TODO"}</td>
            </tr>
        `)
        $("#systemProviderStateTbl > tbody").empty().append(`
            <tr>
                <th>Registerd</th>
                <td>${data.state.registered ? "Yes" : "No"}</td>
            </tr>
        `)
    }
</script>
