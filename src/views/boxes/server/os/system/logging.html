<div class="systemEndpointBox" id="systemEndpointLogging">
    <div class="col-md-12">
        <div class="card bg-dark text-white">
            <div class="card-header">
                <h5>Syslog</h5>
            </div>
            <div class="card-body">
                <table class="table table-dark" id="systemLoggingSyslogTbl">
                    <tbody>

                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script>
    function renderLogging(data) {
        $("#systemEndpointLogging").show()
        $("#systemLoggingSyslogTbl > tbody").empty().append(`
            <tr>
                <th>Address</th>
                <td>${data.config.syslog.address !== "" ? data.config.syslog.address : "Not Set"}</td>
            </tr>
            <tr>
                <th>Protocol</th>
                <td>${data.config.syslog.protocol !== "" ? data.config.syslog.protocol : "Not Set"}</td>
            </tr>
            <tr>
                <th>Log Format</th>
                <td>${data.config.syslog.log_format !== "" ? data.config.syslog.log_format : "Not Set"}</td>
            </tr>
        `)
    }
</script>
