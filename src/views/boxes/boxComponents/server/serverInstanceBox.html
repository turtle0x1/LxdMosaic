<div class="serverViewBox" id="serverInstanceBox">
    <div class="card card-body bg-dark">
        <div class="row">
            <div class="col-md-12 d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center mb-2">
                <div>
                    <div class="input-group" data-bs-theme="dark">
                        <button class="btn btn-outline-secondary dropdown-toggle" type="button"
                            data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false"><i
                                class="fas fa-filter"></i></button>
                        <ul class="dropdown-menu" id="serverInstanceStatus">
                            <li class="dropdown-item">
                                <div class="form-check">
                                    <input class="form-check-input serverInstanceStateFilter" type="checkbox"
                                        value="all" id="serverFilterStatusAll">
                                    <label class="form-check-label" for="serverFilterStatusAll">
                                        All Statuses
                                    </label>
                                </div>
                            </li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                        </ul>
                        <input type="text" class="form-control" id="filterServerInstances"
                            placeholder="Filter instances...">
                    </div>
                </div>
                <div class="btn-toolbar float-end">
                    <div class="btn-group me-2">
                        <button class="btn btn-success serverContainerActions" data-action="start"
                            data-bs-toggle="tooltip" data-bs-placement="bottom" title="Start Instances" disabled>
                            <i class="fas fa-play"></i>
                        </button>
                        <button class="btn btn-warning serverContainerActions" data-action="stop"
                            data-bs-toggle="tooltip" data-bs-placement="bottom" title="Stop Instances" disabled>
                            <i class="fas fa-stop"></i>
                        </button>
                        <button class="btn btn-danger serverContainerActions" data-action="delete"
                            data-bs-toggle="tooltip" data-bs-placement="bottom" title="Delete Instances" disabled>
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <div class="table-responsive">
            <table id="serverInstanceTable" class="table table-sm table-dark " style="vertical-align: middle">
                <thead>
                    <tr>
                        <td> <input type="checkbox" id="toggleAllContainers"> </td>
                        <td> Status </td>
                        <td> Instance </td>
                        <td> IP Addresses </td>
                        <td> <a hred="#" data-bs-toggle="tooltip" data-bs-placement="bottom"
                                title="Disk use is relative to total disk used, not total available size!">Disk
                                Usage</a></td>
                        <td> Memory Usage </td>
                        <td> <a href="#" data-bs-toggle="tooltip" data-bs-placement="bottom"
                                title="Excluding local interface bytes sent & received"> Network Usage </a> </td>
                        <td> Gather Metrics</td>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    function loadHostInstances(req) {
        currentContainerDetails = null;
        let hostId = req.data.hostId;
        currentServer.hostId = hostId
        currentServer.hostAlias = hostsAliasesLookupTable[hostId]
        createDashboardSidebar()
        _loadServerDetailsIfReq(hostId);
        changeActiveNav(".overview")
        $(".boxSlide, .serverViewBox").hide();
        $("#serverInstanceBox, #serverBox").show();
        

        addBreadcrumbs(["Dashboard", hostsAliasesLookupTable[hostId], "Instances"], ["", "", "active"], false, ["/", "", ""]);

        $("#serverBoxNav").find(".active").removeClass("active")
        $("#serverBoxNav .nav-item[data-view='serverInstanceBox'] > .nav-link").addClass("active")

        $(".serverInstanceStateFilter").prop("checked", false)
        $("#serverFilterStatusAll").prop("checked", true)
        $("#filterServerInstances").val("")

        ajaxRequest(globalUrls.hosts.instances.getHostContainers, { hostId: currentServer.hostId }, (data) => {
            let instances = makeToastr(data)
            let instanceStatusesRows = {};

            if (Object.keys(instances).length > 0) {
                let totalDiskUsed = 0;
                let totalBytes = 0;
                $.each(instances, (name, instance) => {
                    totalDiskUsed += instance.state.disk.root.usage
                    $.each(instance.state.network, (networkName, network) => {
                        totalBytes += network.counters.bytes_sent;
                        totalBytes += network.counters.bytes_received;
                    });
                })

                $.each(instances, (name, instance) => {
                    if (!instanceStatusesRows[instance.status]) {
                        instanceStatusesRows[instance.status] = ''
                    }


                    let diskWdith = 0;
                    let diskDisplay = "N/A"
                    if (instance.state.disk !== null && instance.state.disk.length !== 0) {
                        const diskWidth = (instance.state.disk.root.usage / totalDiskUsed) * 100
                        diskDisplay = `<div class="progress bg-secondary" data-bs-toggle="tooltip" data-bs-placement="right" title="${formatBytes(totalDiskUsed)}">
                            <div class="progress-bar bg-primary" role="progressbar" data-bs-toggle="tooltip" data-bs-placement="left" title="${formatBytes(instance.state.disk.root.usage)} - ${diskWidth.toFixed(2)}%" style="width: ${diskWidth}%" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100"></div>
                            <div class="progress-bar bg-secondary" style="width: ${100 - diskWidth}%"></div>`
                    }


                    let bytesSent = 0, bytesRecieved = 0;
                    let ipAddresses = ``;
                    if (instance.status_code == 103) {
                        let networkKeys = Object.keys(instance.state.network)
                        if (networkKeys.length == 1) {
                            ipAddresses = `<div>${networkKeys[0]}: <span>${instance.state.network[networkKeys[0]].addresses[0].address}</span></div>`
                        } else {
                            ipAddresses = `<div>${networkKeys[0]}: <span>${instance.state.network[networkKeys[0]].addresses[0].address}</span> <a class="viewServerInstanceIps" data-addresses="${networkKeys.map(key => instance.state.network[key].addresses[0].address).join(",")}" href="#">+${networkKeys.length - 1} more</a></div>`
                        }
                    }
                    $.each(instance.state.network, (networkName, network) => {
                        bytesSent += network.counters.bytes_sent;
                        bytesRecieved += network.counters.bytes_received;
                    });

                    let metricsButton = `<button data-host-id="${currentServer.hostId}" data-instance="${name}" class='btn btn-outline-primary btn-sm enableMetrics'>
                        Enable
                    </button>`;

                    if (instance.expanded_config.hasOwnProperty("environment.lxdMosaicPullMetrics")) {
                        metricsButton = `<button data-host-id="${currentServer.hostId}" data-instance="${name}" class='btn btn-outline-warning btn-sm disableMetrics'>
                            Disable
                        </button>`;
                    }

                    let memoryWidth = 0;

                    if (instance.status_code == 103) {
                        memoryWidth = (instance.state.memory.usage / instance.state.memory.total) * 100
                    }

                    let bytesRecWidth = (bytesRecieved / totalBytes) * 100
                    let bytesSentWidth = (bytesSent / totalBytes) * 100



                    instanceStatusesRows[instance.status] += `<tr data-name="${name}" data-status="${instance.status}">
                        <td><input name="instanceCheckbox" type="checkbox"/></td>
                        <td><i class="${statusCodeIconMap[instance.status_code]}"></i></td>
                        <td>${name}</td>
                        <td>${ipAddresses}</td>
                        <td>${diskDisplay}</td>
                        <td>
                            <div class="progress bg-secondary" data-bs-toggle="tooltip" data-bs-placement="right" title="${formatBytes(instance.state.memory.total)}">
                            <div class="progress-bar bg-primary" role="progressbar" data-bs-toggle="tooltip" data-bs-placement="left" title="${formatBytes(instance.state.memory.usage)} - ${memoryWidth.toFixed(2)}%" style="width: ${memoryWidth}%" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100"></div>
                            <div class="progress-bar bg-secondary" style="width: ${100 - memoryWidth}%"></div>
                        </td>
                        <td>
                            <div class="progress bg-secondary" data-bs-toggle="tooltip" data-bs-placement="right" title="${formatBytes(totalBytes)}">
                            <div class="progress-bar bg-primary" role="progressbar" data-bs-toggle="tooltip" data-bs-placement="left" title="Recieved: ${formatBytes(bytesRecieved)} - ${bytesRecWidth.toFixed(2)}%" style="width: ${bytesRecWidth}%" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100"></div>
                            <div class="progress-bar bg-success" role="progressbar" data-bs-toggle="tooltip" data-bs-placement="left" title="Sent: ${formatBytes(bytesSent)} - ${bytesSentWidth.toFixed(2)}%" style="width: ${bytesSentWidth}%" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100"></div>
                            
                        </td>
                        <td>${metricsButton}</td>
                    </tr>`
                });
            } else {
                instanceStatusesRows = `<tr><td class="text-center" colspan="999"><i class="fas fa-info-circle text-info me-2"></i>No instances!</td></tr>`
            }

            $("#serverInstanceTable > tbody").empty()

            if (typeof instanceStatusesRows == "string") {
                $("#serverInstanceTable > tbody").append(instanceStatusesRows);
            } else {
                let keys = Object.keys(instanceStatusesRows).sort();
                $.each(keys, (_, key) => {
                    $("#serverInstanceStatus").append(`<li class="dropdown-item"><div class="form-check">
                        <input class="form-check-input serverInstanceStateFilter" type="checkbox" value="${key}" id="${key}">
                        <label class="form-check-label" for="${key}">
                            ${key}
                        </label>
                    </div></li>`)
                    $("#serverInstanceTable > tbody").append(instanceStatusesRows[key])
                })
            }
            $("#serverInstanceTable").find('[data-bs-toggle="tooltip"]').tooltip();
        });
    }

    $(document).on("change", ".serverInstanceStateFilter", function () {
        let target = $(this).val()
        if (target == "all") {
            $(".serverInstanceStateFilter").prop("checked", false)
            $("#serverFilterStatusAll").prop("checked", true)
        } else {
            $("#serverFilterStatusAll").prop("checked", false)
        }
        $("#filterServerInstances").trigger("keyup")
    })

    $(document).on("change", ".toggleStatusContainer", function () {
        let checked = $(this).is(":checked");
        let tr = $(this).parents("tr");

        if (checked) {
            $(".serverContainerActions").attr("disabled", false);
            $("#serverInfoBox").find('[data-bs-toggle="tooltip"]').tooltip("enable")
        } else {
            $(".serverContainerActions").attr("disabled", true);
            $("#serverInfoBox").find('[data-bs-toggle="tooltip"]').tooltip("hide")
            $("#serverInfoBox").find('[data-bs-toggle="tooltip"]').tooltip("disable")
        }

        $("#serverInstanceTable").find(`tr:gt(${tr.index() + 1})`).each(function () {
            if ($(this).hasClass("statusRow")) {
                return false;
            }
            $(this).find("input[name=instanceCheckbox]").prop("checked", checked);
        });
    });

    $(document).on("click", ".disableMetrics", function () {
        let btn = $(this);
        let td = btn.parents("td");
        btn.attr("disabled", true);
        let x = btn.data();

        $.confirm({
            title: 'Disable Metric Gathering?!',
            content: `<div class="form-check">
          <input class="form-check-input" type="checkbox" value="" id="clearMetricdata">
          <label class="form-check-label" for="clearMetricdata">
            Clear Metric Data ?
          </label>
        </div>`,
            buttons: {
                cancel: function () { },
                yes: {
                    btnClass: 'btn-danger',
                    action: function () {
                        this.buttons.yes.setText('<i class="fa fa-cog fa-spin"></i>Deleting..'); // let the user know
                        this.buttons.yes.disable();
                        this.buttons.cancel.disable();
                        var modal = this;
                        x.clearData = modal.$content.find("#clearMetricdata").is(":checked") ? 1 : 0;
                        ajaxRequest(globalUrls.instances.metrics.disablePullGathering, x, (data) => {
                            data = makeToastr(data);
                            if (data.state == "error") {
                                btn.attr("disabled", false);
                                return false;
                            }
                            modal.close();
                            td.empty().append(`<button data-host-id="${x.hostId}" data-instance="${x.instance}" class='btn btn-outline-primary btn-sm enableMetrics'>
                            Enable
                        </button>`);
                        });
                        return false;
                    }
                }
            }
        });

    });

    $(document).on("click", ".enableMetrics", function () {
        let btn = $(this);
        let td = btn.parents("td");
        btn.attr("disabled", true);
        let x = btn.data();

        ajaxRequest(globalUrls.instances.metrics.enablePullGathering, x, (data) => {
            data = makeToastr(data);
            if (data.state == "error") {
                btn.attr("disabled", false);
                return false;
            }

            td.empty().append(`<button data-host-id="${x.hostId}" data-instance="${x.instance}" class='btn btn-outline-warning btn-sm disableMetrics'>
                    Disable
                </button>`);
        });
    });


    $(document).on("change", "input[name=instanceCheckbox]", function () {
        if ($("input[name=instanceCheckbox]:checked").length > 0) {
            $(".serverContainerActions").attr("disabled", false);
            $("#serverInstanceBox").find('[data-bs-toggle="tooltip"]').tooltip("enable")
        } else {
            $(".serverContainerActions").attr("disabled", true);
            $("#serverInstanceBox").find('[data-bs-toggle="tooltip"]').tooltip("hide")
            $("#serverInstanceBox").find('[data-bs-toggle="tooltip"]').tooltip("disable")
        }
    });

    $(document).on("click", "#toggleAllContainers", function () {
        let checked = $(this).is(":checked");

        if (checked) {
            $(".serverContainerActions").attr("disabled", false);
            $("#serverInstanceBox").find('[data-bs-toggle="tooltip"]').tooltip("enable")
        } else {
            $(".serverContainerActions").attr("disabled", true);
            $("#serverInstanceBox").find('[data-bs-toggle="tooltip"]').tooltip("hide")
            $("#serverInstanceBox").find('[data-bs-toggle="tooltip"]').tooltip("disable")
        }

        $("#serverInstanceTable").find("input[name=instanceCheckbox]:visible").each(function () {
            $(this).prop("checked", checked);
        });
    });


    $(document).on("click", ".serverContainerActions", function () {
        let action = $(this).data("action");
        if (action == "") {
            return false;
        }

        let btn = $(this);

        let origHtml = btn.html();

        btn.html("<i class='fas fa-cog fa-spin'></i>");

        let checkboxes = $("#serverInstanceTable").find("input[name=instanceCheckbox]");

        let selectedContainers = checkboxes.filter(":checked").map(function () {
            return $(this).parents("tr").data("name");
        }).get();


        if (selectedContainers.length == 0) {
            $.alert("Please select atleast one container");
            return false;
        }

        let details = {
            hostId: currentServer.hostId,
            containers: selectedContainers
        };

        let url = globalUrls.hosts.instances[action]

        ajaxRequest(url, details, (data) => {
            btn.html(origHtml);
            data = makeToastr(data);
            $("#serverBoxNav").find("[data-view='serverInstanceBox']").trigger("click")
            $("#serverContainerActions").find("option[value='']").prop("selected", true);
            $("#serverInstanceBox").find('[data-bs-toggle="tooltip"]').tooltip("hide")
            $("#serverInstanceBox").find('[data-bs-toggle="tooltip"]').tooltip("disable")
        });
    });

    $(document).on("keyup", "#filterServerInstances", function () {
        let search = $(this).val().trim().toLocaleLowerCase()

        let stateFilters = $(".serverInstanceStateFilter:checked").map(function () {
            return $(this).val()
        }).get()

        let allStateFilter = (stateFilters.length == 1 && stateFilters[0] == "all");

        if (search == "" && allStateFilter) {
            $("#serverInstanceTable").find("tr").show();
            return false;
        }
        $("#serverInstanceTable > tbody > tr").each(function () {
            let tr = $(this);

            let status = tr.data("status")

            let matchesState = true;

            if (!allStateFilter) {
                matchesState = stateFilters.includes(status)
            }

            let matchesText = true;

            if (search !== "") {
                let text = tr.text()
                matchesText = text.includes(search)
            }

            if (matchesText && matchesState) {
                tr.show()
            } else {
                tr.hide()
            }
        });
    });

    $(document).on("click", ".viewServerInstanceIps", function (e) {
        e.stopPropagation()
        e.preventDefault()
        let addresses = $(this).data("addresses").split(",");
        console.log(addresses)
        $.confirm({
            title: "All Addresses",
            content: `<table class="table table-bordered">
                ${addresses.map(add => {
                return `<tr><td>${add}</td></tr>`
            }).join("")}
            </table>`,
            buttons: {
                okay: () => { }
            }

        })
    })
</script>
